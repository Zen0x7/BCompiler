name: Build and Push Boost Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ lower(github.repository) }}
  BOOST_VERSION: 1.92.0_b1

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release, static, shared]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Map variant
        id: args
        run: |
          case ${{ matrix.variant }} in
            debug)   echo "build_variant=Debug"   >> "$GITHUB_OUTPUT"; echo "link_type=static"   >> "$GITHUB_OUTPUT" ;;
            release) echo "build_variant=Release" >> "$GITHUB_OUTPUT"; echo "link_type=shared"   >> "$GITHUB_OUTPUT" ;;
            static)  echo "build_variant=Release" >> "$GITHUB_OUTPUT"; echo "link_type=static"   >> "$GITHUB_OUTPUT" ;;
            shared)  echo "build_variant=Debug"   >> "$GITHUB_OUTPUT"; echo "link_type=shared"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          BUILD_ARGS="--build-arg BUILD_VARIANT=${{ steps.args.outputs.build_variant }} --build-arg LINK_TYPE=${{ steps.args.outputs.link_type }}"

          TAGS=""
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAGS="$TAGS --tag ${IMAGE}:latest-${{ matrix.variant }}-${ARCH}"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$TAGS --tag ${IMAGE}:v${VERSION}-${{ matrix.variant }}-${ARCH}"
          fi

          docker buildx build \
            $BUILD_ARGS \
            $TAGS \
            --push \
            .
